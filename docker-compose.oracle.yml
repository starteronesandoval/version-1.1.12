services:
  api:
    # La API no publica puertos en Oracle: sólo Cloudflare Tunnel puede verla.
    ports: !reset []
    environment:
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:?Define FCM_PROJECT_ID}
      FCM_CREDENTIALS_FILE: /run/secrets/firebase-service-account.json
      FORWARDED_ALLOW_IPS: "*"
      TRUST_CLOUDFLARE_HEADERS: "true"
    volumes:
      - ${FCM_CREDENTIALS_HOST_PATH:?Define FCM_CREDENTIALS_HOST_PATH}:/run/secrets/firebase-service-account.json:ro
      - ${RELEASES_HOST_PATH:?Define RELEASES_HOST_PATH}:/data/releases:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ${CLOUDFLARE_CONFIG_HOST_PATH:?Define CLOUDFLARE_CONFIG_HOST_PATH}:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARE_CREDENTIALS_HOST_PATH:?Define CLOUDFLARE_CREDENTIALS_HOST_PATH}:/etc/cloudflared/credentials.json:ro
