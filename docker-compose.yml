services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: balam
      POSTGRES_USER: balam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el entorno}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balam -d balam"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://balam:${POSTGRES_PASSWORD}@postgres:5432/balam
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en el entorno}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS en el entorno}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS en el entorno}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-20}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      # El PostgreSQL incluido no configura TLS; los servicios administrados deben usar require/verify-full.
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-prefer}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Define STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Define STRIPE_WEBHOOK_SECRET}
      CONNECT_REFRESH_URL: ${CONNECT_REFRESH_URL:?Define CONNECT_REFRESH_URL}
      CONNECT_RETURN_URL: ${CONNECT_RETURN_URL:?Define CONNECT_RETURN_URL}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:?Define BILLING_SUCCESS_URL}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:?Define BILLING_CANCEL_URL}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Define SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Balam}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?Define GOOGLE_CLIENT_IDS en el entorno}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      TRUST_CLOUDFLARE_HEADERS: ${TRUST_CLOUDFLARE_HEADERS:-false}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      MAX_STRIPE_WEBHOOK_BYTES: ${MAX_STRIPE_WEBHOOK_BYTES:-1048576}
      UPLOAD_DIR: /data/uploads
      RELEASE_DOWNLOAD_DIR: /data/releases
    ports:
      # El origen solo es accesible desde esta PC; Cloudflare Tunnel es la entrada pública.
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/data/uploads
      - releases_data:/data/releases:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  releases_data:
